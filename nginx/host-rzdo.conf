# For the server's own nginx, not the container. Copy to /etc/nginx/sites-available/rzdo.
# Certbot then adds the HTTPS parts to the installed copy (see the README).
server {
    listen 80;
    server_name rzdo.sharful.com;
    client_max_body_size 10m;

    location / {
        # WEB_PORT in .env
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Overwrites anything the visitor sent. Django trusts this to know a request is HTTPS.
        proxy_set_header X-Forwarded-Proto $scheme;
        # The LLM button waits for Gemini for up to LLM_REQUEST_TIMEOUT_SECONDS (300).
        proxy_read_timeout 360s;
    }
}
