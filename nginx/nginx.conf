# The nginx container, in front of gunicorn. HTTPS is handled by the server's own nginx
# (see host-rzdo.conf), so this only ever receives plain HTTP from it.
server {
    listen 80;
    server_name _;
    client_max_body_size 10m;

    # Docker's DNS, so nginx finds the app again after a deploy replaces its container.
    resolver 127.0.0.11 valid=10s;
    set $app http://rzdo:8000;

    location / {
        proxy_pass $app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Passed on as received: here $scheme is always http, even for an HTTPS visitor.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        # The LLM button waits for Gemini for up to LLM_REQUEST_TIMEOUT_SECONDS (300).
        proxy_read_timeout 360s;
    }
}
