[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings.dev"
python_files = ["test_*.py", "tests.py"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
# WhiteNoise looks for STATIC_ROOT, which exists only after collectstatic.
filterwarnings = ["ignore:No directory at:UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501"]
# The dev and prod settings extend base.py with a star import, as Django projects usually do.
"core/settings/*.py" = ["F403"]
