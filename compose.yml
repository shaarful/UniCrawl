# `docker compose up -d` starts only the database, the web app and nginx. Crawls and LLM extraction
# then run only when started by hand from the dashboard or admin.
#
# Everything else stays defined here but off until its profile is switched on:
#   --profile redis      Redis only (the queue between the crawler and the LLM worker)
#   --profile scheduler  Redis + Celery worker and beat: automatic crawls
#   --profile llm        Redis + LLM worker: automatic extraction of queued articles

name: rzdo

x-app: &app
  image: rzdo:dev
  build: .
  init: true # reaps the browser processes Playwright leaves behind
  restart: unless-stopped
  env_file: .env
  environment:
    DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-core.settings.dev}
    DATABASE_URL: postgres://${POSTGRES_USER:-rzdo}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-rzdo}
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/1
    CELERY_RESULT_BACKEND: redis://redis:6379/2
  volumes:
    - ./secrets:/secrets:ro

services:
  db:
    image: postgis/postgis:18-3.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rzdo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-rzdo}
    volumes:
      # PostgreSQL 18 images keep their data in a versioned folder under this path.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    <<: *app
    restart: "no"
    command: [python, manage.py, migrate, --noinput]
    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *app
    shm_size: 1gb # Chromium crashes with Docker's default 64 MB
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request as u; u.urlopen('http://localhost:8000/health/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      # Local only: the server's own nginx forwards to this. Without 127.0.0.1, Docker can
      # open the port to the internet and bypass the firewall.
      - 127.0.0.1:${WEB_PORT:-8100}:80
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    profiles: [redis, scheduler, llm]
    restart: unless-stopped
    # Queued articles must survive a restart until the LLM worker acknowledges them.
    command: [redis-server, --appendonly, "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 20

  celery-worker:
    <<: *app
    profiles: [scheduler]
    command: [celery, -A, core, worker, -l, info]
    shm_size: 1gb
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  celery-beat:
    <<: *app
    profiles: [scheduler]
    command: [celery, -A, core, beat, -l, info, --schedule, /tmp/celerybeat-schedule, --pidfile=]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  llm-worker:
    <<: *app
    profiles: [llm]
    command: [python, manage.py, run_llm_worker]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
